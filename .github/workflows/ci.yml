name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Kassa frontend ────────────────────────────────────────────────────────
  # Stands alone: the till talks to the POS API over HTTP and shares no code
  # with it, so nothing here needs pDaftar's domain checked out.
  pos:
    name: pos (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pos/package-lock.json

      - run: npm ci
        working-directory: pos

      - name: oxlint
        run: npm run lint
        working-directory: pos

      - name: vitest
        run: npm test
        working-directory: pos

      - name: tsc + vite build
        run: npm run build
        working-directory: pos

  # ── POS backend, the part that needs nothing but itself ───────────────────
  # Pint is a standalone formatter, so this job installs with --no-scripts and
  # skips the sibling clone entirely. Scoped to the code this repo actually
  # owns; config/ and bootstrap/ are Laravel's skeleton and are not reformatted
  # here just to make a checker happy.
  pos_backend_style:
    name: pos_backend (pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: pos_backend
          composer-options: '--no-scripts'

      - run: ./vendor/bin/pint --test app routes database
        working-directory: pos_backend

  # ── POS backend tests ─────────────────────────────────────────────────────
  # Runs unconditionally now. This used to be two jobs: a preflight that
  # checked for a PAT, and a test job that checked out pdaftar.backend as a
  # sibling because composer.json mapped `App\` into it. Without the secret
  # the tests were skipped — which, since the secret was never set, meant this
  # repository's test suite had never run in CI at all.
  pos_backend_tests:
    name: pos_backend (phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, exif, zip, bcmath, pdo_sqlite
          coverage: none

      # Before composer install: post-autoload-dump boots Laravel to discover
      # packages, and that reads .env.
      - name: .env
        working-directory: pos_backend
        run: cp .env.example .env

      - uses: ramsey/composer-install@v3
        with:
          working-directory: pos_backend

      - name: phpunit
        working-directory: pos_backend
        env:
          REDIS_CLIENT: predis
        run: |
          php artisan key:generate --force
          ./vendor/bin/phpunit
