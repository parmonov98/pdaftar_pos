# pDaftar POS — staging vhost.
#
# One domain serves both halves, because the till asks for '/api/pos/v1' with
# no host (pos/src/api.ts) and vite's dev proxy does the same. That is a
# deliberate choice in the till, not an accident: same-origin in dev and in
# production means the browser exercises one request shape, instead of a
# CORS-preflighted variant that hides header and credential mistakes until
# deploy day. Splitting the two across hosts here would reintroduce exactly
# that gap.
#
#   /            -> pos/dist, the built till (CI rsyncs it here)
#   /api         -> the POS backend container on 127.0.0.1:8090
#
# HTTP only on purpose. `certbot --nginx` rewrites this file in place, adding
# the 443 server and the redirect. Shipping a 443 block with certificate paths
# that do not exist yet makes `nginx -t` fail on a fresh box, which stops
# provisioning before certbot ever gets the chance to run.
#
# The placeholder POS_DOMAIN is substituted by scripts/provision-staging.sh.

server {
    listen 80;
    listen [::]:80;
    server_name POS_DOMAIN;

    server_tokens off;
    proxy_hide_header X-Powered-By;

    root /var/www/pos/pdaftar_pos/pos/dist;
    index index.html;

    access_log /var/log/nginx/pos-staging.access.log;
    error_log  /var/log/nginx/pos-staging.error.log;

    # A sale carries a handful of lines, not an upload. Kept small on purpose:
    # the till has no reason to post megabytes, so a request that does is a bug
    # or an attack, and either should be refused here.
    client_max_body_size 32M;

    # The till is a single-page app with client-side routes. A cashier who
    # reloads on /sale must get index.html, not a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames: safe to cache hard. index.html deliberately is not
    # included — it is the file that points at the new hashes, so caching it
    # is how a till keeps running last week's bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;

        # Matches the container's fastcgi timeouts. A till waiting longer than
        # this has already queued the sale in its outbox and will retry.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Unauthenticated by design (see routes/pos_api.php) and 503 when the link
    # to pDaftar's shared domain is broken — so a monitor can watch this URL
    # and act on the status code alone. Not logged; it is polled constantly.
    location = /api/pos/v1/health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        access_log off;
    }
}
