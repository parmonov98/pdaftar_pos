# pos.pdaftar.uz — the POS Integration API on the devdata server.
#
# A separate vhost on purpose. The POS runs as its own compose project on its
# own port (8090), so restarting or breaking it leaves api.pdaftar.devdata.uz
# serving, and vice versa. That operational independence is the whole reason
# the service was split; sharing a vhost would quietly give it back.
#
# It proxies to the POS's nginx container on the host's loopback, NOT to
# php-fpm directly: the container already carries the fastcgi timeouts a till
# needs (30s, so a hung sale surfaces as a retryable failure rather than
# holding a connection).
#
# Install:
#   sudo cp pos.pdaftar.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pos.pdaftar.uz.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d pos.pdaftar.uz
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pos.pdaftar.uz;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pos.pdaftar.uz;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pos.pdaftar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.pdaftar.uz/privkey.pem;

    access_log /var/log/nginx/pos.pdaftar.uz.access.log;
    error_log  /var/log/nginx/pos.pdaftar.uz.error.log;

    # A sale carries a handful of lines, not an upload. Kept small on purpose:
    # the till has no reason to post megabytes, so a request that does is a bug
    # or an attack, and either should be refused here.
    client_max_body_size 32M;

    proxy_hide_header X-Powered-By;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;

        # Matches the container's fastcgi timeouts. A till waiting longer than
        # this has already queued the sale in its outbox and will retry.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Unauthenticated by design (see routes/pos_api.php) and 503 when the link
    # to pDaftar's shared domain is broken — so a monitor can watch this URL
    # and act on the status code alone. Not logged; it is polled constantly.
    location = /api/pos/v1/health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        access_log off;
    }
}
