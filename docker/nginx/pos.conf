server {
    listen 80;
    index index.php;
    error_log  /var/log/nginx/pos_error.log;
    access_log /var/log/nginx/pos_access.log;
    root /var/www/pos_backend/public;

    client_max_body_size 32M;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-pos:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # A till request is a sale, not a report: 30s is generous and a hung
        # request should surface as a failure the outbox can retry rather than
        # holding a connection for an hour.
        fastcgi_read_timeout 30;
        fastcgi_send_timeout 30;
        fastcgi_connect_timeout 10;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
