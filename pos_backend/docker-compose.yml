# pDaftar POS backend — its own compose project.
#
# Separate containers, separate port, separate lifecycle: restarting or breaking
# the POS leaves pDaftar serving, and vice versa. That operational independence
# is the actual reason to split the service.
#
# Everything it needs is here: its own PHP image, its own MariaDB and its own
# Redis. It used to borrow all three from a pdaftar.backend checkout sitting
# beside it, which meant the POS could not be run at all without cloning a
# different product first.
#
#   docker compose up -d          (from pdaftar_pos/pos_backend/)
#   → http://localhost:8090/api/pos/v1/health

services:
    php-pos:
        build:
            context: ./docker/php
        image: pos-php
        container_name: php-pos
        working_dir: /var/www/pdaftar_pos/pos_backend
        environment:
            - COMPOSER_ALLOW_SUPERUSER=1
        volumes:
            - ../..:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - pos

    nginx-pos:
        image: nginx:alpine
        container_name: nginx-pos
        ports:
            - "8090:80"
        volumes:
            - ../..:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        depends_on:
            - php-pos
        networks:
            - pos

    mariadb:
        image: mariadb:10.11
        container_name: pos-dev-mariadb
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MARIADB_DATABASE: ${DB_DATABASE:-pos}
        ports:
            # Published on loopback so a GUI client can reach it. 3307, not
            # 3306: a developer with pDaftar running locally already has that
            # port, and a POS that refuses to start because of it is a bad
            # first impression.
            - "127.0.0.1:3307:3306"
        volumes:
            - mariadb:/var/lib/mysql
        networks:
            - pos

    redis:
        image: redis:7-alpine
        container_name: pos-dev-redis
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]
        networks:
            - pos

volumes:
    mariadb:

networks:
    pos:
        name: pos_network
